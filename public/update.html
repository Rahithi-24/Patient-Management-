<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Patient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>✏️ Update Patient</h1>
    <p>Edit existing patient information</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">All Patients</a>
    <a href="listOne.html">Search Patient</a>
    <a href="insert.html">Add Patient</a>
    <a href="update.html">Update Patient</a>
    <a href="delete.html">Delete Patient</a>
</nav>
<div class="form-image">
    <img src="images/update-patient.jpg" alt="Healthcare professional reviewing patient details">
    <div>
        <h2>Update Patient Details</h2>
        <p>Keep patient records accurate and up to date.</p>
    </div>
</div>
<main class="container">
    <div class="form-card">
        <h2>Select Patient</h2>

        <div class="form-group">
            <label for="patient_id">Patient ID</label>
            <select id="patient_id" onchange="loadPatient()">
                <option value="">-- Select Patient ID --</option>
            </select>
        </div>

        <form id="updateForm">
            <div class="form-group">
                <label for="patient_name">Patient Name</label>
                <input type="text" id="patient_name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="phone_no">Phone Number</label>
                <input type="tel" id="phone_no" maxlength="15">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" min="0" max="130">
            </div>

            <div class="form-group">
                <label for="problem">Problem</label>
                <textarea id="problem" rows="3"></textarea>
            </div>

            <button type="submit">Update Patient</button>
        </form>

        <p id="message"></p>
    </div>

    <button class="secondary" onclick="location.href='index.html'">
        Home Page
    </button>
</main>

<footer>
    <p>Patient Management System</p>
</footer>

<script>
loadPatientIDs();

function loadPatientIDs() {
    fetch("/patients")
        .then(response => {
            if (!response.ok) throw new Error("Unable to load patient IDs");
            return response.json();
        })
        .then(data => {
            const select = document.getElementById("patient_id");

            data.forEach(patient => {
                const option = document.createElement("option");
                option.value = patient.patient_id;
                option.textContent = patient.patient_id;
                select.appendChild(option);
            });
        })
        .catch(error => {
            document.getElementById("message").textContent = error.message;
        });
}

function loadPatient() {
    const id = document.getElementById("patient_id").value;
    const message = document.getElementById("message");

    document.getElementById("updateForm").reset();

    if (!id) return;

    fetch("/patients/" + encodeURIComponent(id))
        .then(response => {
            if (!response.ok) throw new Error("Unable to load patient");
            return response.json();
        })
        .then(data => {
            if (data.length === 0) {
                message.textContent = "Patient not found.";
                return;
            }

            const patient = data[0];

            document.getElementById("patient_name").value = patient.patient_name ?? "";
            document.getElementById("email").value = patient.email ?? "";
            document.getElementById("phone_no").value = patient.phone_no ?? "";
            document.getElementById("gender").value = patient.gender ?? "";
            document.getElementById("age").value = patient.age ?? "";
            document.getElementById("problem").value = patient.problem ?? "";

            message.textContent = "Patient details loaded. Edit and update.";
        })
        .catch(error => {
            message.textContent = error.message;
        });
}

document.getElementById("updateForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const id = document.getElementById("patient_id").value;

    if (!id) {
        document.getElementById("message").textContent = "Please select a patient ID.";
        return;
    }

    const patient = {
        patient_name: document.getElementById("patient_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone_no: document.getElementById("phone_no").value.trim(),
        gender: document.getElementById("gender").value,
        age: document.getElementById("age").value,
        problem: document.getElementById("problem").value.trim()
    };

    fetch("/patients/" + encodeURIComponent(id), {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(patient)
    })
    .then(async response => {
        const message = await response.text();
        if (!response.ok) throw new Error(message);
        return message;
    })
    .then(message => {
        document.getElementById("message").textContent = message;
    })
    .catch(error => {
        document.getElementById("message").textContent = error.message;
    });
});
</script>

</body>
</html>
